<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waving Emoji Website</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="emoji" id="emoji">👋</div>
        <div class="content">
            <h1 class="title" id="title">Sup, I'm Aiden</h1>
            <h3 class="paragraph" id="paragraph">
                I'm a 17-year-old coder from Canada. I have over 5 years of experience in <span class="italic">Python</span>, and I’m also skilled in <span class="italic">HTML</span>, <span class="italic">Java</span>, and <span class="italic">C++</span>.
            </h3>
            <div class="buttons">
                <a href="https://github.com/aidensorabji" target="_blank" class="button" id="button1">
                    <img src="assets/github-logo.png" alt="GitHub Logo" style="height: 24px; width: 24px;">
                </a>
                <a href="https://unsplash.com/aidensorabji" target="_blank" class="button" id="button2">
                    <img src="assets/unsplash-logo.png" alt="Unsplash Logo" style="height: 24px; width: 24px;">
                </a>
            </div>
        </div>
    </div>
    <div class="navbar">
        <div class="button-container">
            <button class="nav-button dark">Aiden Sorabji</button>
            <button class="nav-button home-button">Home</button>
            <button class="nav-button light">Projects</button>
            <button class="nav-button light">University</button>
            <button class="nav-button light">Resources</button>
        </div>
        <button class="nav-button about-button">About Me</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
